# ==============================================================================
# ClubSphere Production Stack (Docker Compose)
# ==============================================================================
# Production architecture:
#   - Frontend: Multi-stage Nginx container serving React SPA & reverse proxying /api/ and /health
#   - Backend: Hardened non-root FastAPI/Uvicorn container running Alembic migrations at startup
#   - Database: Hosted on a dedicated Neon production/staging branch
#
# Usage:
#   docker compose -f docker-compose.prod.yml --env-file .env.render up -d --build
#
# .env.render is the gitignored placeholder file for this deployment. It is
# deliberately NOT named .env.production because the backend auto-loads that
# name from the repo root, which would break local development/tests.
# ==============================================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clubsphere-prod-backend
    restart: always
    env_file:
      - .env.render
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
    expose:
      - "8000"
    volumes:
      - backend-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: clubsphere-prod-frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-uploads:
