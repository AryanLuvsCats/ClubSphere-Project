[project]
name = "clubsphere-backend"
version = "1.0.0"
description = "ClubSphere — University Club & Activity Lifecycle Management System Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "pyodbc>=5.1.0",
    "aioodbc>=0.5.0",
    "pymssql>=2.3.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.13.0",
    "argon2-cffi>=23.1.0",
    "bcrypt>=4.2.0",
    "pyjwt>=2.9.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",
    "email-validator>=2.0.0",
    "certifi>=2026.10.18",
    "azure-storage-blob>=12.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]
