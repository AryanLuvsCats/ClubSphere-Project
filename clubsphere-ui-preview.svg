    <g><text x="379" y="218" class="tiny">CAMPUS ORGANISATION</text><text x="379" y="247" class="cardtitle">Design &amp;</text><text x="379" y="268" class="cardtitle">Innovation</text><text x="379" y="292" class="tiny">ENGINEERING</text><text x="379" y="318" class="body">Making useful things through</text><text x="379" y="334" class="body">experiments and teamwork.</text><line x1="379" y1="360" x2="529" y2="360" class="rule"/><text x="379" y="380" class="tiny">MEMBERS</text><text x="379" y="414" class="metric">36</text><text x="460" y="380" class="tiny">CHARTERED</text><text x="460" y="402" class="small">28 Aug 2025</text><line x1="379" y1="434" x2="529" y2="434" class="rule"/><text x="379" y="459" class="tiny">CLUB RECORD</text><rect x="452" y="443" width="77" height="25" class="btn"/><text x="462" y="459" class="btntext">JOIN CLUB ↗</text></g>
